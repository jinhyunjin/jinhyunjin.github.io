name: Cancel stale Pages deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  cancel-stale-pages-deployment:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      deployments: write
    steps:
      - name: Cancel the locked Pages deployment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          STALE_DEPLOYMENT_ID: 5598685134
        run: |
          set -euo pipefail

          echo "Attempting to cancel stale deployment: ${STALE_DEPLOYMENT_ID}"

          status_code="$(
            curl -sS -o /tmp/cancel-pages-response.json -w '%{http_code}' \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/deployments/${STALE_DEPLOYMENT_ID}/cancel"
          )"

          echo "Response HTTP status code: ${status_code}"

          if [ "$status_code" = "204" ]; then
            echo "Successfully cancelled Pages deployment ${STALE_DEPLOYMENT_ID}."
          elif [ "$status_code" = "404" ]; then
            echo "Pages deployment ${STALE_DEPLOYMENT_ID} was already gone."
          else
            echo "Unexpected response from GitHub Pages cancel endpoint:" >&2
            cat /tmp/cancel-pages-response.json >&2
            exit 1
          fi
