name: Cancel stale Pages deployment

on:
  push:
    branches:
      - main

jobs:
  cancel-stale-pages-deployment:
    runs-on: ubuntu-latest
    permissions:
      pages: write
    steps:
      - name: Cancel the locked Pages deployment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          STALE_DEPLOYMENT_ID: 3f40fca00dec6d0bc80504ca758ffe525d66db10
        run: |
          set -euo pipefail

          status_code="$(
            curl -sS -o /tmp/cancel-pages-response.json -w '%{http_code}' \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/deployments/${STALE_DEPLOYMENT_ID}/cancel"
          )"

          if [ "$status_code" = "204" ]; then
            echo "Cancelled Pages deployment ${STALE_DEPLOYMENT_ID}."
          elif [ "$status_code" = "404" ]; then
            echo "Pages deployment ${STALE_DEPLOYMENT_ID} was already gone."
          else
            echo "Unexpected response from GitHub Pages cancel endpoint:" >&2
            cat /tmp/cancel-pages-response.json >&2
            exit 1
          fi
