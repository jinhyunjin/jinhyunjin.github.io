name: Cancel stale Pages deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  cancel-stale-pages-deployment:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      deployments: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cancel the locked Pages deployment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          STALE_DEPLOYMENT_ID: 3f40fca00dec6d0bc80504ca758ffe525d66db10
        run: |
          set -euo pipefail

          echo "Attempting to cancel stale deployment: ${STALE_DEPLOYMENT_ID}"

          status_code="$(
            curl -sS -o pages-cancel-response.json -w '%{http_code}' \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/deployments/${STALE_DEPLOYMENT_ID}/cancel"
          )"

          echo "" >> pages-cancel-response.json
          echo "Response HTTP status code: ${status_code}" >> pages-cancel-response.json

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages-cancel-response.json
          git commit -m "chore: save pages cancel response [skip ci]" || echo "No changes to commit"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git main || echo "Push to artist-site failed"
